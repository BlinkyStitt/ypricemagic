---
name: PyTest
'on':
  push:
    branches:
    - master
    - dev
    paths:
    - "**.py"
    - "**/pytest.yaml"
  pull_request:
    branches:
    - master
    - dev
concurrency:
  group: pr-ci-pytest.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["**.py","**/pytest.yaml"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  test:
    runs-on: "${{ matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}"
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        network:
        - mainnet
        - bsc-main
        - polygon-main
        - ftm-main
        include:
        - os: ubuntu-latest
          path: "~/.cache/pip"
        - os: macos-latest
          path: "~/Library/Caches/pip"
        - os: windows-latest
          path: "~\\AppData\\Local\\pip\\Cache"
        - network: mainnet
          provider: WEB3_PROVIDER
        - network: bsc-main
          provider: BSC_WEB3_PROVIDER
        - network: polygon-main
          provider: POLY_WEB3_PROVIDER
        - network: ftm-main
          provider: FTM_WEB3_PROVIDER
    steps:
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Python (faster than using Python container)
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.9'
    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('**/requirements-dev.txt') }}"
        path: "${{ matrix.path }}\n"
    - name: Cache joblib middleware cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: forceupdatedeletethislater3-${{ runner.os }}-${{ matrix.network }}-${{ hashFiles('**/middleware.py') }}-${{ hashFiles('**/requirements.txt') }}
        path: "./cache/*/joblib/web3/middleware/filter/middleware\n"
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
        pip install -r requirements.txt
    - name: Setup brownie networks
      env:
        BROWNIE_NETWORK_ID: "${{ matrix.network }}"
        RPC_PROVIDER: "${{ secrets[matrix.provider] }}"
      shell: bash
      run: |
        if [ -z "$RPC_PROVIDER" ]; then
          echo '::error::Configure the RPC provider secret selected by this network matrix before running integration tests.'
          exit 1
        fi
        brownie networks modify "$BROWNIE_NETWORK_ID" "host=$RPC_PROVIDER"
    - name: Cache compilers and brownie deployments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: forceupdatedeletethislater3-${{ runner.os }}-brownie-cache-${{ matrix.network }}
        path: |
          ~/.brownie/deployments.db
          ~/.solcx
          ~/.vvm
    - name: Run test suite
      env:
        BROWNIE_NETWORK: "${{ matrix.network }}"
        BROWNIE_NETWORK_ID: "${{ matrix.network }}"
        ETHERSCAN_TOKEN: "${{ secrets.ETHERSCAN_TOKEN }}"
        BSCSCAN_TOKEN: "${{ secrets.BSCSCAN_TOKEN }}"
        POLYGONSCAN_TOKEN: "${{ secrets.POLYGONSCAN_TOKEN }}"
        FTMSCAN_TOKEN: "${{ secrets.FTMSCAN_TOKEN }}"
      run: make test
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (pytest.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["test"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
